name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.6"
          python-version: "3.11"
          enable-cache: false
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(uv run --frozen python -c 'import ruleloom; print(ruleloom.__version__)')"
          test "$RELEASE_TAG" = "v$package_version"
      - name: Build and verify
        run: make check
      - name: Install the exact distributions in clean environments
        run: |
          set -- dist/*.whl
          test "$#" -eq 1
          wheel_path="$1"
          set -- dist/*.tar.gz
          test "$#" -eq 1
          sdist_path="$1"

          uv venv --python 3.11 .release-smoke-wheel-core
          uv pip install --python .release-smoke-wheel-core/bin/python "$wheel_path"
          .release-smoke-wheel-core/bin/ruleloom --version
          uv pip check --python .release-smoke-wheel-core/bin/python

          uv venv --python 3.11 .release-smoke-sdist-core
          uv pip install --python .release-smoke-sdist-core/bin/python "$sdist_path"
          .release-smoke-sdist-core/bin/ruleloom --version
          uv pip check --python .release-smoke-sdist-core/bin/python

          uv venv --python 3.11 .release-smoke-wheel-mcp
          uv pip install --python .release-smoke-wheel-mcp/bin/python "${wheel_path}[mcp]"
          .release-smoke-wheel-mcp/bin/ruleloom --version
          uv pip check --python .release-smoke-wheel-mcp/bin/python
      - name: Stage immutable distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish reviewed distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions from the unprivileged build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
